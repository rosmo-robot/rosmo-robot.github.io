name: Beautiful Jekyll CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: Build Jekyll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Match the builder used by GitHub Pages publishing.
      - name: Build the site with GitHub Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Save website preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: jekyll-preview
          path: ./_site/
          retention-days: 7
          if-no-files-found: error
